<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Lời Yêu Thương 20/10</title>
    <!-- Font chữ nghệ thuật -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #feada6, #f3a683);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* -------------------------------------------------- */
        /* HIỆU ỨNG CÁC BÔNG HOA LỚN ẨN NỀN TINH TẾ          */
        /* -------------------------------------------------- */
        .bg-flower-large {
            position: absolute;
            font-size: clamp(120px, 20vw, 250px);
            color: rgba(255, 255, 255, 0.18);
            text-shadow: 0 0 20px rgba(255, 107, 139, 0.1);
            pointer-events: none;
            z-index: 0;
            user-select: none;
            filter: blur(1px);
        }
        .flower-top-left {
            top: -5%;
            left: -5%;
            animation: rotateSlow 25s linear infinite;
        }
        .flower-bottom-right {
            bottom: -5%;
            right: -5%;
            animation: rotateSlowReverse 30s linear infinite;
        }
        .flower-mid-left {
            bottom: 20%;
            left: -8%;
            font-size: clamp(90px, 15vw, 180px);
            opacity: 0.12;
            animation: rotateSlow 20s linear infinite;
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateSlowReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        /* KHUNG CHÍNH (PC & LAPTOP) */
        .card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(235, 94, 139, 0.12);
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: appStart 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
            
            width: 520px;
            padding: 45px 40px;
        }
        @keyframes appStart {
            to { opacity: 1; }
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d11a5b;
            font-size: 46px; 
            margin-bottom: 10px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .subtitle {
            color: #6c5b7b;
            text-transform: uppercase;
            font-size: 14px; 
            margin-bottom: 35px;
            letter-spacing: 1px;
        }
        input[type="text"] {
            border: 2px solid rgba(209, 26, 91, 0.15);
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            font-weight: 700;
            color: #4a1525;
            text-align: center;
            transition: all 0.3s ease;
            width: 90%;
            padding: 16px 25px;
            border-radius: 30px;
            font-size: 16px;
            margin-bottom: 25px;
        }
        input[type="text"]:focus {
            border-color: #d11a5b;
            background: #fff;
            box-shadow: 0 10px 20px rgba(209, 26, 91, 0.08);
        }
        button {
            background: linear-gradient(135deg, #d11a5b, #ff6b8b);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(209, 26, 91, 0.2);
            transition: all 0.2s ease;
            padding: 16px 50px;
            font-size: 16px;
            border-radius: 30px;
        }
        button:active {
            transform: scale(0.98);
        }
        #resultBox {
            display: none;
            border-top: 2px dashed rgba(209, 26, 91, 0.12);
            animation: slideUp 0.6s ease forwards;
            margin-top: 35px; 
            padding-top: 25px;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .greeting {
            font-family: 'Dancing Script', cursive;
            color: #d11a5b;
            font-size: 36px; 
            margin-bottom: 15px;
        }
        .message {
            color: #4a4a4a;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            font-size: 16px;
            line-height: 1.8;
            padding: 22px;
            border-radius: 16px;
            text-align: left;
        }
        /* ĐÈ CSS DÀNH RIÊNG CHO ĐIỆN THOẠI (MOBILE) */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .card {
                width: 100%;
                max-width: 380px; 
                padding: 30px 15px;
                background: rgba(255, 255, 255, 0.78);
            }
            h1 { font-size: 28px; margin-bottom: 5px; }
            .subtitle { font-size: 11px; margin-bottom: 25px; }
            input[type="text"] {
                width: 100%;
                padding: 13px 20px;
                border-radius: 25px;
                font-size: 14.5px;
                margin-bottom: 20px;
            }
            button {
                width: 100%;
                padding: 14px 20px;
                font-size: 15px;
                border-radius: 25px;
            }
            #resultBox { margin-top: 25px; padding-top: 20px; }
            .greeting { font-size: 26px; margin-bottom: 10px; }
            .message {
                font-size: 14px;
                line-height: 1.6;
                padding: 15px;
                border-radius: 12px;
                text-align: justify;
            }
        }
        /* PHÔNG NỀN TIM VÀ PHÁO HOA NHỎ RƠI */
        .bg-heart-small {
            position: absolute;
            color: rgba(255, 107, 139, 0.2);
            pointer-events: none;
            animation: floatBackground 6s ease-in-out infinite;
            z-index: 1;
            font-size: 20px;
        }
        @keyframes floatBackground {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-15px) scale(1.05) rotate(10deg); }
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -20px;
            opacity: 0;
            z-index: 5;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* ========== NÚT QR NHỎ ẨN GÓC TRÊN PHẢI ========== */
        #qrBtn {
            position: fixed;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #d11a5b;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0.55;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(209, 26, 91, 0.15);
        }
        #qrBtn:hover {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.7);
        }
        #qrBtn:active {
            transform: scale(0.95);
        }

        /* Modal QR */
        #qrModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .qr-box {
            background: white;
            border-radius: 20px;
            padding: 24px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 90vw;
            position: relative;
        }
        .qr-box h3 {
            font-family: 'Dancing Script', cursive;
            color: #d11a5b;
            font-size: 26px;
            margin-bottom: 12px;
        }
        .qr-box p {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        #qrImage {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
        }
        .close-qr {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 22px;
            color: #999;
            cursor: pointer;
            padding: 4px 8px;
        }
        .close-qr:hover {
            color: #d11a5b;
        }
    </style>
</head>
<body>
    <!-- Các bông hoa lớn ẩn phông nền nghệ thuật -->
    <div class="bg-flower-large flower-top-left">🌸</div>
    <div class="bg-flower-large flower-mid-left">🌹</div>
    <div class="bg-flower-large flower-bottom-right">🌹</div>
    <!-- Các tim nhỏ lơ lửng bổ sung tầng trên -->
    <div class="bg-heart-small" style="top: 25%; left: 15%; animation-delay: 0s;">❤️</div>
    <div class="bg-heart-small" style="top: 20%; right: 20%; animation-delay: 2s;">✨</div>
    <div class="bg-heart-small" style="bottom: 25%; right: 15%; animation-delay: 4s;">❤️</div>

    <!-- NÚT QR NHỎ ẨN GÓC TRÊN PHẢI -->
    <div id="qrBtn" title="Tạo mã QR chia sẻ trang này" onclick="showQR()">📱</div>

    <!-- MODAL HIỆN QR -->
    <div id="qrModal" onclick="closeQR(event)">
        <div class="qr-box" onclick="event.stopPropagation()">
            <button class="close-qr" onclick="closeQR()">×</button>
            <h3>Quét mã để vào trang</h3>
            <p>Chia sẻ lời chúc 20/10 này cho người ấy nhé ✨</p>
            <img id="qrImage" src="" alt="QR Code">
        </div>
    </div>

    <div class="card">
        <h1>Happy Women's Day</h1>
        <div class="subtitle">Gửi lời chúc 20/10 ngọt ngào</div>
        
        <div class="input-wrapper">
            <input type="text" id="visitorName" placeholder="Nhập tên của bạn hoặc người ấy..." autocomplete="off">
        </div>
        <button onclick="generateSpecialMessage()">Chạm vào đây để nhận thông điệp ✨</button>
        <div id="resultBox">
            <div class="greeting" id="sayHello"></div>
            <div class="message" id="wishingText"></div>
        </div>
    </div>

    <script>
        // Danh sách câu chúc có chiều sâu tâm lý lắng đọng sâu sắc
        const wishes = [
            "Chúc bạn ngày 20/10 ngập tràn yêu thương. Mong bạn hiểu rằng thế giới ngoài kia dẫu có vội vã, chỉ cần giữ được một góc lặng trong tim, mọi bão giông đều hóa thành mây khói. 🌸",
            "Ngày 20/10 chúc bạn luôn rạng rỡ như ánh mai. Nhưng hơn cả sự tỏa sáng bên ngoài, mong tâm bạn kiên định như ngọn núi để không bị lay chuyển bởi những lời phán xét hay kỳ vọng của người đời. ✨",
            "Gửi đến bạn lời chúc 20/10 ấm áp nhất. Ý nghĩa thực sự của cuộc sống không nằm ở những điều lớn lao, mong bạn mỗi ngày thức dậy đều thấy lòng đủ rộng để bao dung cho chính những vết thương cũ. ❤️",
            "Chúc bạn một ngày Phụ nữ Việt Nam thật ý nghĩa. Mong bạn nhận ra hành trình rực rỡ nhất không phải là đi đến đỉnh cao, mà là tìm lại được sự tự tại và nguyên bản trong tâm hồn mình. 🌹",
            "Ngày 20/10 này, mong bạn học được cách thương mình trước khi thương người khác. Đôi khi buông bỏ một kỳ vọng sai lầm lại là cách tốt nhất để đón nhận một đời an yên, tự do đúng nghĩa. 🍃",
            "Chúc bạn luôn xinh đẹp và tự tin. Nhưng hãy nhớ rằng vẻ đẹp tối thượng của người phụ nữ là sự tĩnh lặng trước nghịch cảnh, giữ vững một tâm thế thản nhiên dù dòng đời có xoay vần ra sao. 🚀",
            "Mong rằng ngày 20/10 mang đến cho bạn những khoảnh khắc vui vẻ. Và mong bạn sớm nhận ra, món quà xa xỉ nhất thế gian này chính là một trái tim tự do, không thuộc về bất kỳ sự ràng buộc nào. 💖",
            "Chúc người phụ nữ tuyệt vời hôm nay có một ngày trọn vẹn. Người ta thường chúc bạn hạnh phúc, nhưng tôi mong tâm bạn luôn đủ sáng để nhìn thấu rằng hạnh phúc vốn dĩ tự thân chứ chẳng cầu cạnh từ ai. ☀️",
            "Chào ngày 20/10! Sống một cuộc đời nhẹ tênh không phải là trốn chạy trách nhiệm, mà là khi bạn biết yêu lấy cả những phần chưa hoàn hảo của bản thân mình mà không mưu cầu sự công nhận. 🌊",
            "Gửi ngàn lời chúc tốt đẹp nhất đến bạn ngày 20/10. Mong bạn giữa những lo toan cơm áo vẫn thỉnh thoảng dừng lại, để lắng nghe tiếng nói sâu thẳm của đứa trẻ bên trong đang cần được vỗ về. 🍀",
            "Chúc bạn 20/10 ngập tràn niềm vui. Hạnh phúc không phải là có tất cả mọi thứ, mà là khi lòng bạn không còn gợn chút âu lo, thong dong bước đi mà không cần nhìn lại quá khứ. 🌸",
            "Mừng ngày 20/10, chúc bạn có đủ mạnh mẽ để tiến về phía trước. Nhưng cũng mong bạn đủ dịu dàng với chính mình, chấp nhận rằng có những ngày yếu lòng cũng là một loại sức mạnh. ✨",
            "Chúc bạn một ngày 20/10 thật rực rỡ bên những người thân yêu. Đi qua nửa đời người mới hiểu, bình an đích thực là khi đứng trước một người từng làm mình tổn thương mà lòng không còn chút gợn sóng. ❤️",
            "Gửi đóa hoa lòng tặng bạn ngày 20/10. Cuộc sống này vốn dĩ là một dòng chảy, mong tâm bạn không cố chấp bám víu vào bất cứ điều gì, cứ thuận theo tự nhiên mà an lành, tự tại. 🌹",
            "Chúc bạn 20/10 ngọt ngào. Trang sức lộng lẫy nhất của người phụ nữ không phải vàng ngọc, mà là năng lượng từ một tâm hồn đã đi qua nhiều đổ vỡ nhưng vẫn giữ được sự thiện lương, trong trẻo. 💎",
            "Ngày 20/10, chúc bạn gặt hái được nhiều thành công trong sự nghiệp. Nhưng đừng quên quay về chăm sóc thế giới bên trong, bởi nếu ngôi nhà nội tại không vững, mọi lâu đài bên ngoài cũng chỉ là hư vô. 🌟",
            "Chúc bạn luôn giữ được nụ cười trong sáng. Giữa một thế giới luôn đòi hỏi người phụ nữ phải hoàn hảo, mong bạn can đảm sống thật với cảm xúc của mình, dẫu đó là những vết xước thầm kín. 🎈",
            "Mong bạn ngày 20/10 nhận được thật nhiều sự trân trọng. Nhưng trên hết, mong bạn không cần đợi ai ban phát sự trân trọng ấy, tự mình nâng niu và làm chủ cuộc đời mình mới là chân lý. ☁️",
            "Chúc mừng ngày Phụ nữ Việt Nam! Đừng chỉ sống như một đóa hồng rực rỡ chỉ để người ta ngắm nghía, hãy sống như một nhành cỏ dại, âm thầm bám rễ sâu vào đất và kiêu hãnh sinh tồn. 🌿",
            "Gửi lời chúc bình an nhất đến bạn ngày 20/10. Khi bạn có đủ tĩnh lặng để cảm nhận hiện tại, bạn sẽ thấy mọi danh vọng bấy lâu nay theo đuổi suy cho cùng cũng chỉ là mây khói thoảng qua. 💖",
            "Chúc bạn một ngày 20/10 ngập tràn năng lượng. Mong tâm bạn phẳng lặng như mặt hồ mùa thu, không phải vì cuộc đời không có sóng gió, mà vì bạn đã học được cách làm hòa với chúng. 🍁",
            "Chúc người bạn trân quý ngày 20/10 hạnh phúc. Khi lòng không còn chấp niệm vào việc đúng hay sai, thắng hay thua, đó chính là thời điểm sự bình an tự khắc gõ cửa cuộc đời bạn. ✨",
            "Ngày 20/10 chúc bạn có một tâm hồn nở hoa. Sống ở đời, điều khó nhất không phải là nhìn thấu tâm can người khác, mà là đối diện thẳng thắn và ôm lấy những phần tối tăm nhất của chính mình. 🌸",
            "Gửi bạn lời chúc 20/10 chân thành nhất. Mong bạn bớt nhìn vào những gì mình chưa có, học cách biết ơn những gì đang hiện hữu, bởi sự đủ đầy đích thực bắt nguồn từ một trái tim biết đủ. ❤️",
            "Chúc bạn luôn xinh đẹp theo dòng thời gian. Người phụ nữ trí tuệ là người biết dùng sự im lặng đúng lúc để chữa lành, dùng sự thản nhiên để bước qua những nhiễu nhương của cuộc đời. 🌹",
            "Mừng ngày 20/10, chúc bạn luôn tìm thấy niềm vui từ những điều nhỏ nhặt. Khi tâm bạn không còn chứa đựng những oán hận, khoảng trống ấy tự động sẽ được lấp đầy bởi ánh nắng và tình yêu. ☀️",
            "Chúc bạn 20/10 tràn đầy tiếng cười. Hãy cứ để sự bình an dẫn lối, vì tất cả những hào nhoáng ngoài kia nếu phải đánh đổi bằng sự bất an trong lòng thì đều là một giao dịch thua lỗ. 🧭",
            "Mong bạn ngày 20/10 tràn ngập hoa hồng. Tự do thực sự không phải là làm những gì mình thích, mà là khi bạn có đủ dũng khí để từ chối những giá trị không thuộc về bản chất của mình. 🕊️",

        function generateSpecialMessage() {
            const nameInput = document.getElementById("visitorName").value.trim();
            if (nameInput === "") {
                alert("Bạn quên nhập tên mất rồi kìa! 😉");
                return;
            }
            document.getElementById("sayHello").innerText = `Thân gửi ${nameInput} ✨`;
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById("wishingText").innerText = randomWish;
            
            document.getElementById("resultBox").style.display = "block";
            createConfettiEffect();
        }

        function createConfettiEffect() {
            const colors = ['#ff477e', '#ff7096', '#ffb3c6', '#ffd166', '#06d6a0', '#118ab2'];
            const isMobile = window.innerWidth <= 768;
            const count = isMobile ? 60 : 130; 
            
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const size = Math.random() * 5 + 6;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                
                confetti.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }

  function showQR() {
    const currentUrl = "https://womensday-blue-alpha.vercel.app/";

    // Tạo mã QR chứa đường dẫn website đầy đủ
    const qrUrl =
        `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentUrl)}&color=d11a5b`;

    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('qrModal').style.display = 'flex';
}

        function closeQR(e) {
            // Nếu click vào nền đen hoặc nút × thì đóng
            if (!e || e.target === document.getElementById('qrModal') || e.target.classList.contains('close-qr')) {
                document.getElementById('qrModal').style.display = 'none';
            }
        }
    </script>
