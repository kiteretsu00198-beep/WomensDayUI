<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thông Điệp Mỗi Ngày</title>
    <!-- Font chữ nghệ thuật -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #feada6, #f3a683);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* -------------------------------------------------- */
        /* HIỆU ỨNG CÁC BÔNG HOA LỚN ẨN NỀN TINH TẾ          */
        /* -------------------------------------------------- */
        .bg-flower-large {
            position: absolute;
            font-size: clamp(120px, 20vw, 250px);
            color: rgba(255, 255, 255, 0.18);
            text-shadow: 0 0 20px rgba(255, 107, 139, 0.1);
            pointer-events: none;
            z-index: 0;
            user-select: none;
            filter: blur(1px);
        }
        .flower-top-left {
            top: -5%;
            left: -5%;
            animation: rotateSlow 25s linear infinite;
        }
        .flower-bottom-right {
            bottom: -5%;
            right: -5%;
            animation: rotateSlowReverse 30s linear infinite;
        }
        .flower-mid-left {
            bottom: 20%;
            left: -8%;
            font-size: clamp(90px, 15vw, 180px);
            opacity: 0.12;
            animation: rotateSlow 20s linear infinite;
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateSlowReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        /* KHUNG CHÍNH (PC & LAPTOP) */
        .card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(235, 94, 139, 0.12);
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: appStart 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
            
            width: 520px;
            padding: 45px 40px;
        }
        @keyframes appStart {
            to { opacity: 1; }
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d11a5b;
            font-size: 46px; 
            margin-bottom: 10px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .subtitle {
            color: #6c5b7b;
            text-transform: uppercase;
            font-size: 14px; 
            margin-bottom: 35px;
            letter-spacing: 1px;
        }
        input[type="text"] {
            border: 2px solid rgba(209, 26, 91, 0.15);
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            font-weight: 700;
            color: #4a1525;
            text-align: center;
            transition: all 0.3s ease;
            width: 90%;
            padding: 16px 25px;
            border-radius: 30px;
            font-size: 16px;
            margin-bottom: 25px;
        }
        input[type="text"]:focus {
            border-color: #d11a5b;
            background: #fff;
            box-shadow: 0 10px 20px rgba(209, 26, 91, 0.08);
        }
        button {
            background: linear-gradient(135deg, #d11a5b, #ff6b8b);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(209, 26, 91, 0.2);
            transition: all 0.2s ease;
            padding: 16px 50px;
            font-size: 16px;
            border-radius: 30px;
        }
        button:active {
            transform: scale(0.98);
        }
        #resultBox {
            display: none;
            border-top: 2px dashed rgba(209, 26, 91, 0.12);
            animation: slideUp 0.6s ease forwards;
            margin-top: 35px; 
            padding-top: 25px;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .greeting {
            font-family: 'Dancing Script', cursive;
            color: #d11a5b;
            font-size: 36px; 
            margin-bottom: 15px;
        }
        .message {
            color: #4a4a4a;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            font-size: 16px;
            line-height: 1.8;
            padding: 22px;
            border-radius: 16px;
            text-align: left;
        }
        /* ĐÈ CSS DÀNH RIÊNG CHO ĐIỆN THOẠI (MOBILE) */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .card {
                width: 100%;
                max-width: 380px; 
                padding: 30px 15px;
                background: rgba(255, 255, 255, 0.78);
            }
            h1 { font-size: 28px; margin-bottom: 5px; }
            .subtitle { font-size: 11px; margin-bottom: 25px; }
            input[type="text"] {
                width: 100%;
                padding: 13px 20px;
                border-radius: 25px;
                font-size: 14.5px;
                margin-bottom: 20px;
            }
            button {
                width: 100%;
                padding: 14px 20px;
                font-size: 15px;
                border-radius: 25px;
            }
            #resultBox { margin-top: 25px; padding-top: 20px; }
            .greeting { font-size: 26px; margin-bottom: 10px; }
            .message {
                font-size: 14px;
                line-height: 1.6;
                padding: 15px;
                border-radius: 12px;
                text-align: justify;
            }
        }
        /* PHÔNG NỀN TIM VÀ PHÁO HOA NHỎ RƠI */
        .bg-heart-small {
            position: absolute;
            color: rgba(255, 107, 139, 0.2);
            pointer-events: none;
            animation: floatBackground 6s ease-in-out infinite;
            z-index: 1;
            font-size: 20px;
        }
        @keyframes floatBackground {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-15px) scale(1.05) rotate(10deg); }
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -20px;
            opacity: 0;
            z-index: 5;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* ========== NÚT QR NHỎ ẨN GÓC TRÊN PHẢI ========== */
        #qrBtn {
            position: fixed;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #d11a5b;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0.55;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(209, 26, 91, 0.15);
        }
        #qrBtn:hover {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.7);
        }
        #qrBtn:active {
            transform: scale(0.95);
        }

        /* Modal QR */
        #qrModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
       .qr-box {
            background: white;
            border-radius: 20px;
            padding: 30px 24px 24px 24px; /* Tăng khoảng trống phía trên một chút để không bị dính nút x */
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 90vw;
            width: 320px;
            position: relative;
        }
        .qr-box h3 {
            font-family: 'Dancing Script', cursive;
            color: #d11a5b;
            font-size: 26px;
            margin-bottom: 12px;
        }
        .qr-box p {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        #qrImage {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
        }
        .close-qr {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05); /* Tạo nền tròn nhẹ nhàng, dễ nhìn hơn */
            border: none;
            font-size: 20px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .close-qr:hover, .close-qr:active {
            background: #d11a5b;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Các bông hoa lớn ẩn phông nền nghệ thuật -->
    <div class="bg-flower-large flower-top-left">🌸</div>
    <div class="bg-flower-large flower-mid-left">🌹</div>
    <div class="bg-flower-large flower-bottom-right">🌹</div>
    <!-- Các tim nhỏ lơ lửng bổ sung tầng trên -->
    <div class="bg-heart-small" style="top: 25%; left: 15%; animation-delay: 0s;">❤️</div>
    <div class="bg-heart-small" style="top: 20%; right: 20%; animation-delay: 2s;">✨</div>
    <div class="bg-heart-small" style="bottom: 25%; right: 15%; animation-delay: 4s;">❤️</div>

    <!-- NÚT QR NHỎ ẨN GÓC TRÊN PHẢI -->
    <div id="qrBtn" title="Tạo mã QR chia sẻ trang này" onclick="showQR()">📱</div>

<!-- MODAL HIỆN QR -->
<div id="qrModal" onclick="closeQR(event)">
    <div class="qr-box" onclick="event.stopPropagation()">
        <button class="close-qr" onclick="closeQR()">×</button>
        <h3>Quét mã để vào trang</h3>
        <p>Chia sẻ thông điệp tích cực này với mọi người nhé ✨</p>
        <img id="qrImage" src="" alt="QR Code">
        
        <!-- NÚT RESET MINI BÉ BÉ -->
        <div style="margin-top: 12px; text-align: center;">
            <button onclick="resetTestLimit()" style="
                background: transparent; 
                color: #b0bec5; 
                border: 1px solid #e0e0e0;
                font-size: 10px; 
                padding: 3px 8px; 
                border-radius: 10px; 
                box-shadow: none; 
                width: auto;
                cursor: pointer;
                transition: all 0.2s;
            " onmouseover="this.style.color='#d11a5b'; this.style.borderColor='#d11a5b';" onmouseout="this.style.color='#b0bec5'; this.style.borderColor='#e0e0e0';">
                ⚙️ Reset test
            </button>
        </div>
    </div>
</div>
    <div class="card">
        <h1>Thông Điệp Mỗi Ngày</h1>
        <div class="subtitle">Một lời nhắn tích cực dành riêng cho bạn</div>
        
        <div class="input-wrapper">
            <input type="text" id="visitorName" placeholder="Nhập tên của bạn hoặc người ấy..." autocomplete="off">
        </div>
        <!-- Cập nhật thẻ button: Thêm id="submitBtn" để dễ điều khiển qua JS -->
<button id="submitBtn" onclick="generateSpecialMessage()">Chạm vào đây để nhận thông điệp ✨</button>
        <div id="resultBox">
            <div class="greeting" id="sayHello"></div>
            <div class="message" id="wishingText"></div>
        </div>
    </div>

    <script>
        // Những thông điệp tích cực để bắt đầu ngày mới
        const wishes = [
            "Chúc bạn bắt đầu ngày mới với một nụ cười. Những điều tốt đẹp thường bắt đầu từ một tâm thế tích cực. 🌸",
            "Hãy tin vào bản thân: bạn đã vượt qua nhiều điều khó khăn hơn những gì hôm nay đang thử thách bạn. ✨",
            "Không cần phải hoàn hảo mới xứng đáng được yêu thương. Hãy dịu dàng với chính mình nhé. ❤️",
            "Mỗi bước nhỏ bạn đi hôm nay đều đang đưa bạn đến gần hơn với điều mình mong muốn. 🌱",
            "Nếu hôm nay chưa như ý, hãy nhớ rằng ngày mai luôn là một cơ hội mới để bắt đầu. ☀️",
            "Bạn không cần so sánh hành trình của mình với ai khác. Cứ tiến về phía trước theo nhịp riêng của bạn. 🦋",
            "Dành cho mình một chút nghỉ ngơi cũng là cách để tiếp tục mạnh mẽ hơn. Hãy lắng nghe cơ thể nhé. 🍃",
            "Một lời tử tế bạn trao đi có thể làm ngày của ai đó trở nên tươi sáng hơn. 💖",
            "Hãy trân trọng những điều nhỏ bé đang khiến bạn mỉm cười hôm nay. Đó cũng là hạnh phúc. 🌼",
            "Bạn có quyền bắt đầu lại, đổi hướng và chọn điều khiến mình bình yên hơn. 🕊️",
            "Khó khăn không định nghĩa con người bạn; cách bạn kiên trì bước tiếp mới làm nên điều đó. 💪",
            "Hôm nay, hãy làm điều tốt nhất có thể với những gì bạn đang có. Như vậy đã rất đáng tự hào rồi. 🌟",
            "Đừng quên dành cho bản thân sự bao dung mà bạn vẫn luôn dành cho những người mình yêu quý. 🥰",
            "Chậm lại một chút, hít thở thật sâu và để tâm trí được nghỉ ngơi. Bạn không cần phải vội. 🌿",
            "Một ngày bình thường cũng có thể trở nên đặc biệt khi bạn biết ơn những điều mình đang có. ☁️",
            "Hãy để những sai lầm hôm qua trở thành bài học, không phải lý do để bạn nghi ngờ chính mình. 📖",
            "Bạn xứng đáng với những mối quan hệ khiến mình được tôn trọng, lắng nghe và là chính mình. 🤍",
            "Cứ kiên nhẫn với ước mơ của bạn. Những điều ý nghĩa thường cần thời gian để nảy nở. 🌷",
            "Niềm vui hôm nay có thể đến từ một tách trà, một cuộc trò chuyện hay một khoảnh khắc yên bình. ☕",
            "Dù hôm nay thế nào, hãy nhớ bạn không cần phải giải quyết mọi thứ cùng một lúc. Từng bước một thôi. 🌈"
        ];

               function createConfettiEffect() {
            const colors = ['#ff477e', '#ff7096', '#ffb3c6', '#ffd166', '#06d6a0', '#118ab2'];
            const isMobile = window.innerWidth <= 768;
            const count = isMobile ? 60 : 130; 
            
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const size = Math.random() * 5 + 6;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                
                confetti.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }

        // ========== HÀM TẠO & HIỆN QR ==========
  function showQR() {
    const currentUrl = "https://womensday-blue-alpha.vercel.app/";

    // Tạo mã QR chứa đường dẫn website đầy đủ
    const qrUrl =
        `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentUrl)}&color=d11a5b`;

    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('qrModal').style.display = 'flex';
}

        function closeQR(e) {
            // Nếu click vào nền đen hoặc nút × thì đóng
            if (!e || e.target === document.getElementById('qrModal') || e.target.classList.contains('close-qr')) {
                document.getElementById('qrModal').style.display = 'none';
            }
        }
    </script>
<script>
    // =========================================================
    // 1. TỰ ĐỘNG KIỂM TRA TRẠNG THÁI NÚT KHI TRANG MỚI TẢI
    // =========================================================
    document.addEventListener("DOMContentLoaded", function() {
        checkButtonStatus();
    });

    function getLocalDateKey() {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function checkButtonStatus() {
        const today = getLocalDateKey();
        const lastClickedDate = localStorage.getItem("lastClickedDate");
        const submitBtn = document.getElementById("submitBtn");

        if (lastClickedDate === today) {
            disableButton(submitBtn);
        }
    }

    function disableButton(btn) {
        btn.disabled = true;
        btn.innerText = "Hôm nay bạn đã nhận thông điệp rồi! Hẹn gặp lại vào ngày mai ❤️";
        btn.style.background = "linear-gradient(135deg, #b0bec5, #cfd8dc)";
        btn.style.cursor = "not-allowed";
        btn.style.boxShadow = "none";
        btn.style.opacity = "0.85";
    }

    // =========================================================
    // 2. XỬ LÝ KHI NGƯỜI DÙNG BẤM NHẬN THÔNG ĐIỆP
    // =========================================================
    function generateSpecialMessage() {
        const nameInput = document.getElementById("visitorName").value.trim();
        if (nameInput === "") {
            alert("Bạn quên nhập tên mất rồi kìa! 😉");
            return;
        }

        // Lấy ngày hiện tại (YYYY-MM-DD)
        const today = getLocalDateKey();

        // Hiển thị thông điệp và hiệu ứng pháo hoa
        document.getElementById("sayHello").innerText = `Thân gửi ${nameInput} ✨`;
        const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
        document.getElementById("wishingText").innerText = randomWish;
        document.getElementById("resultBox").style.display = "block";
        createConfettiEffect();

        // Lưu vết ngày bấm và vô hiệu hóa nút ngay lập tức
        localStorage.setItem("lastClickedDate", today);
        disableButton(document.getElementById("submitBtn"));
    }

    // =========================================================
    // 3. NHẬN DIỆN MÁY TÍNH & ĐIỆN THOẠI ĐỂ CHẶN F12 / CHUỘT PHẢI
    // =========================================================
    function isMobileDevice() {
        return (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) || (navigator.maxTouchPoints > 0 && window.innerWidth <= 1024);
    }

    // CHỈ BẬT LỚP BẢO VỆ NẾU LÀ MÁY TÍNH (DESKTOP)
    if (!isMobileDevice()) {
        // Chặn phím F12, Ctrl+U, Ctrl+Shift+I/J/C
        document.addEventListener('keydown', function (e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
                (e.ctrlKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                alert("Tính năng này đã bị vô hiệu hóa trên máy tính!");
                return false;
            }
        });

        // Chặn click chuột phải
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Cảnh báo khi bật F12 DevTools
        setInterval(function() {
            const threshold = 160;
            if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh; color:#d11a5b;'>Vui lòng tắt công cụ lập trình để tiếp tục xem trang web!</h2>";
            }
        }, 1000);
    }
// =========================================================
// HÀM RESET DÙNG ĐỂ TEST (GẮN TRONG MODAL QR)
// =========================================================
function resetTestLimit() {
    // Xóa dữ liệu ngày đã bấm trong localStorage
    localStorage.removeItem("lastClickedDate");
    
    // Lấy lại nút bấm
    const submitBtn = document.getElementById("submitBtn");
    
    // Khôi phục lại trạng thái ban đầu của nút
    submitBtn.disabled = false;
    submitBtn.innerText = "Chạm vào đây để nhận thông điệp ✨";
    submitBtn.style.background = "linear-gradient(135deg, #d11a5b, #ff6b8b)";
    submitBtn.style.cursor = "pointer";
    submitBtn.style.boxShadow = "0 8px 15px rgba(209, 26, 91, 0.2)";
    submitBtn.style.opacity = "1";
    
    // Ẩn khung kết quả đi nếu muốn
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("visitorName").value = "";

    // Thông báo nhỏ cho bạn biết đã reset thành công
    alert("Đã reset thành công! Bây giờ bạn có thể test lại từ đầu.");
    
    // Đóng modal QR lại luôn cho gọn
    document.getElementById('qrModal').style.display = 'none';
}
